[package]
name = "git-lex"
version = "0.0.1"
edition = "2024"
description = "Git extensions for knowledge graphs"
license = "Unlicense"
repository = "https://github.com/repolex-ai/git-lex"

[lib]
name = "git_lex"
path = "src/lib.rs"

[[bin]]
name = "git-lex"
path = "src/main.rs"

[[bin]]
name = "git-lex-serve"
path = "src/bin/git-lex-serve.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
oxigraph = { version = "0.5.6", features = ["rdf-12"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-openssl"] }
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
regex = "1"
oxiri = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rudof_lib = "=0.2.8"
tree-sitter = "0.26"
tree-sitter-md = { version = "0.5", features = ["parser"] }
dateparser = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tower = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
futures-util = "0.3"
open = "5"
