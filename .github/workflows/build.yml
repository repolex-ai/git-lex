name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # TODO: aarch64-unknown-linux-gnu — `cross` default image's g++
          # is too old for oxrocksdb-sys (-std=c++20). Needs a Cross.toml
          # with a newer ubuntu base. Post-demo polish.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball (for direct download / Releases)
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/git-lex dist/
          cp target/${{ matrix.target }}/release/git-lex-serve dist/
          cp LICENSE README.md dist/
          cd dist
          tar czf ../git-lex-${{ matrix.target }}.tar.gz *

      - name: Layout uncompressed binaries (for plugin bin/ consumption)
        shell: bash
        run: |
          mkdir -p plugin-bin-layout/bin/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/git-lex plugin-bin-layout/bin/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/git-lex-serve plugin-bin-layout/bin/${{ matrix.target }}/

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-lex-${{ matrix.target }}
          path: git-lex-${{ matrix.target }}.tar.gz
          retention-days: 90

      - name: Upload plugin-bin-layout artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bin-${{ matrix.target }}
          path: plugin-bin-layout/
          retention-days: 90

      - name: Attach tarball to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: git-lex-${{ matrix.target }}.tar.gz
