# Triggers after the build matrix completes successfully on main (or on workflow_dispatch).
# Downloads each `plugin-bin-<target>` artifact produced by build.yml — currently 3 platforms
# (darwin-arm64, darwin-x86_64, linux-x86_64); linux-arm64 dropped pending oxrocksdb C++20 fix.
# The wildcard pattern handles any subset gracefully — adding/removing platforms requires no
# changes to this workflow.
#
# Checks out the subtext-mcp repo with a PAT, lays the binaries into bin/.platforms/<target>/,
# and pushes directly to main. Solo maintainer + demo cadence: PR-and-merge ceremony adds
# friction without adding safety. The build matrix is the only gate that matters — if those
# binaries built green, they ship.
#
# REQUIRES: repository secret `SUBTEXT_MCP_PAT` — fine-grained PAT with
#   - Repository access: repolex-ai/subtext-mcp
#   - Permissions: Contents=write
#
# Why a PAT and not GITHUB_TOKEN: GITHUB_TOKEN is scoped to the current repo only.
# Cross-repo writes need a token that has write on the target repo.

name: Sync binaries to subtext-mcp plugin

on:
  workflow_run:
    workflows: ["build"]      # must match build.yml's `name:` exactly (case-sensitive)
    types: [completed]
    branches: [main]
  workflow_dispatch:           # manual trigger for testing

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read            # download artifacts from the upstream build run
      contents: read           # checkout the workflow's own repo (git-lex)
    # NOTE: writes to the subtext-mcp repo (checkout + push to main) use
    # SUBTEXT_MCP_PAT, not GITHUB_TOKEN. The job-level permissions above only
    # govern access to git-lex itself.

    steps:
      - name: Checkout subtext-mcp
        uses: actions/checkout@v4
        with:
          repository: repolex-ai/subtext-mcp
          token: ${{ secrets.SUBTEXT_MCP_PAT }}
          path: subtext-mcp

      - name: Resolve build run ID (artifact source)
        id: build_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # On workflow_run trigger: use the upstream run that just completed.
          # On workflow_dispatch trigger: look up the most recent successful
          # build.yml run on main and use that.
          if [ -n "${{ github.event.workflow_run.id || '' }}" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            echo "Using upstream workflow_run id: $run_id"
          else
            run_id=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow build.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "No successful build.yml run found on main — nothing to sync" >&2
              exit 1
            fi
            echo "Using latest successful build run on main: $run_id"
          fi
          {
            echo "run_id=$run_id"
            head_sha=$(gh run view "$run_id" --repo "${{ github.repository }}" --json headSha --jq '.headSha')
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Download plugin-bin artifacts from build run
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: plugin-bin-*
          merge-multiple: false
          run-id: ${{ steps.build_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lay out binaries into subtext-mcp/bin/.platforms/
        run: |
          set -euo pipefail
          shopt -s nullglob   # empty glob expands to nothing, not the literal pattern
          # Layout A (locked 2026-04-26): per-platform binaries live under
          # bin/.platforms/<target>/. The plugin's MCP server symlinks the
          # host-target binaries up into bin/ at startup, because Claude Code's
          # plugin bin/-PATH augmentation only sees the top-level bin/ dir.
          mkdir -p subtext-mcp/bin/.platforms
          # Each artifact is plugin-bin-<target>/bin/<target>/{git-lex,git-lex-serve}
          # (build.yml lays them out in plain bin/<target>/ inside the artifact)
          artifact_dirs=(artifacts/plugin-bin-*)
          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "No plugin-bin-* artifacts found — build run may have failed or expired" >&2
            exit 1
          fi
          for artifact_dir in "${artifact_dirs[@]}"; do
            target=$(basename "$artifact_dir" | sed 's/^plugin-bin-//')
            echo "Syncing target: $target"
            mkdir -p "subtext-mcp/bin/.platforms/$target"
            cp -f "$artifact_dir/bin/$target/git-lex" "subtext-mcp/bin/.platforms/$target/"
            cp -f "$artifact_dir/bin/$target/git-lex-serve" "subtext-mcp/bin/.platforms/$target/"
            chmod +x "subtext-mcp/bin/.platforms/$target/git-lex" "subtext-mcp/bin/.platforms/$target/git-lex-serve"
          done
          ls -laR subtext-mcp/bin/

      - name: Compute git-lex version short SHA
        id: meta
        run: |
          set -euo pipefail
          GITLEX_SHA="${{ steps.build_run.outputs.head_sha }}"
          GITLEX_SHA_SHORT=$(echo "$GITLEX_SHA" | cut -c1-7)
          echo "gitlex_sha_short=$GITLEX_SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Commit and push binaries directly to subtext-mcp main
        run: |
          set -euo pipefail
          cd subtext-mcp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/
          # Skip if nothing changed (binaries byte-identical to what's already there).
          if git diff --cached --quiet; then
            echo "No binary changes — skipping commit/push."
            exit 0
          fi
          git commit -m "binaries: sync git-lex @ ${{ steps.meta.outputs.gitlex_sha_short }}"
          # Pull-with-rebase first to land cleanly if something else pushed
          # since we checked out (rare, but the safe default).
          git pull --rebase origin main
          git push origin main
